<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Vanilla + Bootstrap</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Gestor de Tareas | Vanilla JS & Bootstrap 5</span>
            <span class="badge bg-primary">Cliente 1</span>
        </div>
    </nav>
    <div class="container pb-5">
        <div class="row g-4">
            <!-- Columna Formulario -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold py-3">
                        <span id="formTitle">Nueva Tarea</span>
                    </div>
                    <div class="card-body">
                        <form id="taskForm">
                            <input type="hidden" id="taskId">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="titulo" required placeholder="Ej. Terminar reporte">
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="3" placeholder="Detalles de la tarea..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="prioridad" class="form-label">Prioridad</label>
                                <select class="form-select" id="prioridad">
                                    <option value="Baja">Baja</option>
                                    <option value="Media" selected>Media</option>
                                    <option value="Alta">Alta</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btnGuardar">Guardar Tarea</button>
                            <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btnCancelar" onclick="resetForm()">Cancelar Edición</button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Columna Lista de Tareas -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">Listado de Tareas</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="cargarTareas()">Recargar</button>
                    </div>
                    <div class="card-body">
                        <div id="loadingSpinner" class="text-center py-4 d-none">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="text-muted mt-2">Cargando tareas desde el backend...</p>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="tasksTable">
                                <thead class="table-light">
                                    <tr>
                                        <th>Estado</th>
                                        <th>Título y Descripción</th>
                                        <th>Prioridad</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="taskListBody">
                                    <!-- Inserción dinámica de filas vía JS -->
                                </tbody>
                            </table>
                        </div>
                        <div id="emptyMessage" class="text-center py-4 text-muted d-none">
                            No hay tareas registradas. ¡Agrega una nueva!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
